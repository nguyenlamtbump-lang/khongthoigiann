<!--
  huyhieu.html — KHO ẢNH HUY HIỆU HẠNG cho index.html.
  • index.html tải file này (cùng thư mục) rồi đọc các thẻ <img data-hh="..."> bên dưới để hiện huy hiệu ở Trang cá nhân.
  • Khóa data-hh phải khớp với index.html: crown (Legend), swords (Master), shield (Admin), gavel (Kiểm duyệt viên), trophy (Giải đấu), gem (Premium).
  • Ảnh huy hiệu lấy từ index.html cũ (WebP nền trong suốt, đã thu về 192×192 px + nén lại để nhẹ — ảnh chỉ hiển thị ~90px nên không giảm độ nét). 5 ảnh gốc; riêng ảnh cúp (trophy) đã vá phần thân cúp bị khuyết dưới ngôi sao (ảnh gốc bị mất mảng này). Khung màu, ánh sáng, đổ bóng… của huy hiệu vẫn do CSS trong index.html quyết định như trước.
  • Muốn đổi huy hiệu: thay đúng thuộc tính src của thẻ <img> tương ứng (giữ nguyên data-hh).
  • Trang này chỉ để XEM TRƯỚC: nền tối theo màu từng hạng (giống ngoài web) vì ảnh được làm sáng để đặt trên nền tối.
-->

</style>
